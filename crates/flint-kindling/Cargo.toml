[package]
name = "flint-kindling"
description = "Connection-first Rust Kindling orchestration over Flint transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Pull flint-fronted's boring Chrome dial path so FrontedBootstrap can actually
# dial edges (without it, dial_fronts_alpn returns Unsupported at runtime). Proxyless needs the same
# engine for both legs of its dial, so it rides the same switch.
boring = ["flint-fronted/boring", "flint-proxyless/boring"]

[dependencies]
flint-fronted = { path = "../flint-fronted" }
# The proxyless bootstrap transport (no proxy, no exit hop) as a race member.
flint-proxyless = { path = "../flint-proxyless" }
flint-transport = { path = "../flint-transport" }
# `ConnectionTransport` is an `#[async_trait]` trait, so implementing it needs the macro at build time,
# not just in tests.
async-trait = { workspace = true }
# OnceCell memoizes the front scan; the orchestration is otherwise std-sync.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
flate2 = { workspace = true }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
